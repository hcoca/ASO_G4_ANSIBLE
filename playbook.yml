---
# ==============================================================================
# Ansible Playbook: Despliegue LAMP en openSUSE Leap 15.6 / 16.0
# Task 5: Apache, PHP, phpMyAdmin, MariaDB, Samba, VSFTPD y PostgreSQL
# ==============================================================================
- name: Desplegar infraestructura de servicios (LAMP, Samba, FTP y PostgreSQL)
  hosts: servidor
  become: true
  roles:
    - role: vsftpd
      tags: [ftp, vsftpd]

    - role: apache
      tags: [lamp, apache, web]

    - role: mariadb
      tags: [lamp, mariadb, db]

    - role: phpmyadmin
      tags: [lamp, phpmyadmin]

    - role: samba
      tags: [samba, smb]

    - role: postgresql
      tags: [postgresql, db]
