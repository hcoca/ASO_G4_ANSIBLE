---
# Defaults for Apache role on openSUSE
apache_packages:
  - apache2
  - php8
  - apache2-mod_php8
  - php8-mysql
  - php8-mbstring
  - php8-gd
  - php8-zip
  - php8-zlib
  - php8-curl
  - php8-opcache

apache_service: apache2
apache_document_root: /srv/www/htdocs
apache_server_admin: webmaster@localhost
apache_enable_firewalld: true
