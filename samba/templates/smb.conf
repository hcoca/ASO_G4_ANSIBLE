# /etc/samba/smb.conf - Managed by Ansible
# Target: openSUSE Leap 15.6 / 16.0

[global]
   workgroup = {{ samba_workgroup }}
   server string = {{ samba_server_string }}
   netbios name = {{ samba_netbios_name }}
   security = user
   map to guest = Bad User
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

# ====================================================================
# Samba Shared Resource
# ====================================================================
[{{ samba_share_name }}]
   comment = {{ samba_share_comment }}
   path = {{ samba_share_path }}
   valid users = {{ samba_system_user }}, @{{ samba_system_group }}
   read only = {{ samba_read_only }}
   browsable = {{ samba_browsable }}
   writable = yes
   guest ok = no
   create mask = {{ samba_create_mask }}
   directory mask = {{ samba_directory_mask }}
   force create mode = {{ samba_force_create_mode }}
   force directory mode = {{ samba_force_directory_mode }}
