---
- name: Instalar phpMyAdmin y el modulo de integracion con Apache
  community.general.zypper:
    name:
      - phpMyAdmin
      - phpMyAdmin-apache
    state: present
  environment:
    ZYPP_LOCK_TIMEOUT: "120"

- name: Asegurar que el directorio de configuracion de phpMyAdmin existe
  ansible.builtin.file:
    path: "{{ phpmyadmin_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configurar phpMyAdmin (/etc/phpMyAdmin/config.inc.php)
  ansible.builtin.template:
    src: config.inc.php
    dest: "{{ phpmyadmin_conf_dir }}/config.inc.php"
    owner: root
    group: www
    mode: '0640'
  notify: Reiniciar apache2

- name: Configurar acceso web en Apache (/etc/apache2/conf.d/phpMyAdmin.conf)
  ansible.builtin.template:
    src: phpMyAdmin-apache.conf
    dest: "{{ phpmyadmin_apache_conf_dir }}/phpMyAdmin.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar apache2
