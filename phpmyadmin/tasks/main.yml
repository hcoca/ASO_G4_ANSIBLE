---
- name: Instalar phpMyAdmin y el modulo de integracion con Apache
  community.general.zypper:
    name:
      - phpMyAdmin
      - phpMyAdmin-apache
    state: present
  environment:
    ZYPP_LOCK_TIMEOUT: "120"

- name: Asegurar que el directorio de configuracion de phpMyAdmin existe
  ansible.builtin.file:
    path: "{{ phpmyadmin_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Habilitar modulo php8 en Apache para phpMyAdmin
  ansible.builtin.command: a2enmod php8
  register: pma_a2enmod_result
  changed_when: "'already' not in pma_a2enmod_result.stdout and 'already' not in pma_a2enmod_result.stderr"
  notify: Reiniciar apache2
