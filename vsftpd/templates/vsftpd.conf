# /etc/vsftpd.conf - Managed by Ansible
# Target: openSUSE Leap 15.6 / 16.0

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
xferlog_std_format=YES
listen=NO
listen_ipv6=YES
pam_service_name=vsftpd
userlist_enable=YES
tcp_wrappers=NO

# Chroot local users for security
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode ports
pasv_enable=YES
pasv_min_port={{ vsftpd_pasv_min_port | default(40000) }}
pasv_max_port={{ vsftpd_pasv_max_port | default(40100) }}
