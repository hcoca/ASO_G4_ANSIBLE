[defaults]
# Archivo de inventario con los hosts administrados
inventory = hosts

# Buscar los roles en el directorio actual
roles_path = .

# Desactivar la verificacion de la clave SSH del host (util en laboratorios)
host_key_checking = False

# No crear archivos .retry cuando una jugada falla
retry_files_enabled = False

# Mostrar la salida de las tareas en formato YAML para mayor legibilidad
stdout_callback = yaml

# ====================================================================
# Optimizacion de rendimiento (mejorar el tiempo de respuesta)
# ====================================================================
# Recoleccion inteligente de hechos con cache para evitar consultas lentas repetidas
gathering = smart

# Almacenar los hechos recolectados en archivos JSON en lugar de volver a consultar los hosts
fact_caching = jsonfile

# Directorio donde se escriben los archivos JSON de la cache de hechos
fact_caching_connection = /tmp/ansible_facts_cache

# Mantener los hechos en cache validos durante 24 horas (en segundos)
fact_caching_timeout = 86400

# Ejecucion paralela (hasta 10 hosts a la vez)
forks = 10

# Reducir los tiempos de espera entre sondeos
internal_poll_interval = 0.001

# Perfilado de ejecucion de tareas para monitorizar el tiempo de ejecucion
callbacks_enabled = timer, profile_tasks

[ssh_connection]
# El pipelining reduce las conexiones SSH enviando los modulos Python de Ansible
# directamente al interprete Python remoto por stdin en lugar de copiar archivos
pipelining = True

# La multiplexacion SSH mantiene la conexion maestra activa durante 80 segundos entre tareas
# PreferredAuthentications prueba primero las claves SSH y luego la contrasena
ssh_args = -o ControlMaster=auto -o ControlPersist=80s -o PreferredAuthentications=publickey,password

# Nombre del archivo de socket: %%h = host, %%p = puerto, %%r = usuario remoto
control_path = %(directory)s/ansible-ssh-%%h-%%p-%%r
