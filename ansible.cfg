[defaults]
# Archivo de inventario con los hosts administrados
inventory = hosts

# Buscar los roles en el directorio actual
roles_path = .

# Desactivar la verificacion de la clave SSH del host (util en laboratorios)
host_key_checking = False

# No crear archivos .retry cuando una jugada falla
retry_files_enabled = False

# Mostrar la salida de las tareas en formato YAML para mayor legibilidad
stdout_callback = yaml
